server {
    listen 80;
    server_name localhost;

    # Runtime remote resolution — never baked into JS bundles
    location = /config.json {
        alias /usr/share/nginx/html/config.json;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin *;
    }

    location /people/ {
        alias /usr/share/nginx/html/people/;
        try_files $uri $uri/ /people/index.html;
        add_header Access-Control-Allow-Origin *;
    }

    location /delivery/ {
        alias /usr/share/nginx/html/delivery/;
        try_files $uri $uri/ /delivery/index.html;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        root /usr/share/nginx/html/shell;
        try_files $uri $uri/ /index.html;
    }
}
